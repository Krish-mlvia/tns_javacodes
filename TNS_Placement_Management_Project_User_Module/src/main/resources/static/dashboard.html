<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PlaceManage — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css"/>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-brand">
            <span class="navbar-brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            </span>
            PlaceManage
        </div>
        <div class="navbar-right">
            <div class="navbar-user">
                <div class="navbar-avatar" id="navbar-avatar"></div>
                <span id="navbar-user"></span>
            </div>
            <button class="btn btn-outline btn-sm" onclick="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
        <div class="page-header">
            <div>
                <h2 class="page-title">User Management</h2>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="search-bar">
                    <span class="search-bar-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Search users…" oninput="filterUsers()"/>
                </div>
                <button class="btn btn-primary" onclick="openModal('add')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add User
                </button>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">University</div>
                    <div class="stat-value" id="stat-university">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Corporate</div>
                    <div class="stat-value" id="stat-corporate">0</div>
                </div>
            </div>
        </div>

        <!-- User Table -->
        <div class="table-card">
            <div class="table-toolbar">
                <span class="table-title">All Users</span>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="ALL" onclick="setFilter('ALL',this)">All</button>
                    <button class="filter-tab" data-filter="UNIVERSITY" onclick="setFilter('UNIVERSITY',this)">University</button>
                    <button class="filter-tab" data-filter="CORPORATE" onclick="setFilter('CORPORATE',this)">Corporate</button>
                </div>
            </div>
            <table class="data-table" id="user-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>User</th>
                        <th>Username</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-tbody">
                    <!-- Skeleton rows -->
                    <tr class="skeleton-row"><td><span class="skeleton" style="width:24px"></span></td><td><span class="skeleton" style="width:140px"></span></td><td><span class="skeleton" style="width:100px"></span></td><td><span class="skeleton" style="width:80px"></span></td><td><span class="skeleton" style="width:100px"></span></td></tr>
                    <tr class="skeleton-row"><td><span class="skeleton" style="width:24px"></span></td><td><span class="skeleton" style="width:120px"></span></td><td><span class="skeleton" style="width:90px"></span></td><td><span class="skeleton" style="width:80px"></span></td><td><span class="skeleton" style="width:100px"></span></td></tr>
                    <tr class="skeleton-row"><td><span class="skeleton" style="width:24px"></span></td><td><span class="skeleton" style="width:160px"></span></td><td><span class="skeleton" style="width:110px"></span></td><td><span class="skeleton" style="width:80px"></span></td><td><span class="skeleton" style="width:100px"></span></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add User</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="modal-error" class="alert alert-error hidden"></div>
            <form id="modal-form" novalidate>
                <input type="hidden" id="modal-id"/>
                <div class="form-group">
                    <label for="modal-name">Full Name</label>
                    <input type="text" id="modal-name" placeholder="Enter full name" required/>
                </div>
                <div class="form-group">
                    <label for="modal-username">Username</label>
                    <input type="text" id="modal-username" placeholder="Enter username" required/>
                </div>
                <div class="form-group">
                    <label for="modal-type">Account Type</label>
                    <select id="modal-type" required>
                        <option value="" disabled selected>Select type</option>
                        <option value="UNIVERSITY">University</option>
                        <option value="CORPORATE">Corporate</option>
                    </select>
                </div>
                <div class="form-group" id="password-group">
                    <label for="modal-password">Password <span id="password-hint" class="hint">(leave blank to keep current)</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="modal-password" placeholder="Enter password"/>
                        <button type="button" class="toggle-pw" id="modal-toggle-pw" aria-label="Toggle password">
                            <svg id="modal-pw-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modal-submit-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal-overlay hidden" id="delete-overlay">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Confirm Delete</h3>
                <button class="modal-close" onclick="closeDeleteModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <p class="delete-msg">Are you sure you want to delete this user? This action <strong>cannot be undone</strong>.</p>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    Delete
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let allUsers = [];
        let activeFilter = 'ALL';
        let pendingDeleteId = null;

        const EYE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const EYE_OFF_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        const EDIT_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
        const TRASH_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

        // Password toggle in modal
        document.getElementById('modal-toggle-pw').addEventListener('click', function() {
            const pw = document.getElementById('modal-password');
            const isHidden = pw.type === 'password';
            pw.type = isHidden ? 'text' : 'password';
            this.innerHTML = isHidden ? EYE_OFF_ICON : EYE_ICON;
        });

        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('loggedInUser');
            if (!user) { window.location.href = 'index.html'; return; }
            document.getElementById('navbar-user').textContent = user;
            document.getElementById('navbar-avatar').textContent = user.charAt(0).toUpperCase();
            loadUsers();
        });

        // Close modals on overlay click
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('delete-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });

        function logout() {
            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('loggedInUserId');
            window.location.href = 'index.html';
        }

        async function loadUsers() {
            try {
                const res = await fetch('http://localhost:8080/api/users/all');
                const data = await res.json();
                if (res.ok) {
                    allUsers = data.data;
                    updateStats(allUsers);
                    renderUsers(applyFilter(allUsers));
                } else {
                    showToast('error', data.message || 'Failed to load users.');
                }
            } catch(err) {
                showToast('error', 'Cannot connect to server.');
            }
        }

        function updateStats(users) {
            animateCount('stat-total', users.length);
            animateCount('stat-university', users.filter(u => u.type === 'UNIVERSITY').length);
            animateCount('stat-corporate', users.filter(u => u.type === 'CORPORATE').length);
        }

        function applyFilter(users) {
            const q = (document.getElementById('search-input').value || '').toLowerCase();
            return users.filter(u => {
                const matchFilter = activeFilter === 'ALL' || u.type === activeFilter;
                const matchSearch = !q || u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q);
                return matchFilter && matchSearch;
            });
        }

        function filterUsers() {
            renderUsers(applyFilter(allUsers));
        }

        function setFilter(filter, el) {
            activeFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderUsers(applyFilter(allUsers));
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-tbody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="table-empty">No users found.</td></tr>';
                return;
            }
            tbody.innerHTML = users.map((u, i) => {
                const initials = u.name ? u.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '?';
                const avatarClass = u.type === 'CORPORATE' ? 'row-avatar corporate' : 'row-avatar';
                const badgeSvg = u.type === 'UNIVERSITY'
                    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>`;
                return `
                <tr>
                    <td style="color:var(--color-text-light);font-size:0.82rem;font-weight:600;">${u.id}</td>
                    <td><div class="name-cell"><span class="${avatarClass}">${initials}</span><span>${escHtml(u.name)}</span></div></td>
                    <td style="color:var(--color-text-muted);">@${escHtml(u.username)}</td>
                    <td><span class="badge badge-${u.type.toLowerCase()}">${badgeSvg}${u.type}</span></td>
                    <td>
                        <div style="display:flex;gap:6px;">
                            <button class="btn btn-sm btn-outline" onclick='openModal("edit", ${JSON.stringify(u)})'>${EDIT_ICON} Edit</button>
                            <button class="btn btn-sm btn-danger-outline" onclick="openDeleteModal(${u.id})">${TRASH_ICON} Delete</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function openModal(mode, user) {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('modal-form').reset();
            document.getElementById('modal-toggle-pw').innerHTML = EYE_ICON;
            document.getElementById('modal-password').type = 'password';
            const hint = document.getElementById('password-hint');
            if (mode === 'add') {
                document.getElementById('modal-title').textContent = 'Add User';
                document.getElementById('modal-id').value = '';
                hint.classList.add('hidden');
                document.getElementById('modal-password').required = true;
            } else {
                document.getElementById('modal-title').textContent = 'Edit User';
                document.getElementById('modal-id').value = user.id;
                document.getElementById('modal-name').value = user.name;
                document.getElementById('modal-username').value = user.username;
                document.getElementById('modal-type').value = user.type;
                hint.classList.remove('hidden');
                document.getElementById('modal-password').required = false;
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        const SAVE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`;
        const BTN_SAVE_HTML = `${SAVE_ICON} Save`;

        document.getElementById('modal-submit-btn').innerHTML = BTN_SAVE_HTML;

        document.getElementById('modal-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('modal-submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span> Saving…';

            const id = document.getElementById('modal-id').value;
            const name = document.getElementById('modal-name').value.trim();
            const username = document.getElementById('modal-username').value.trim();
            const type = document.getElementById('modal-type').value;
            const password = document.getElementById('modal-password').value;
            const errorDiv = document.getElementById('modal-error');
            errorDiv.classList.add('hidden');

            const payload = { name, username, type };
            if (password) payload.password = password;

            try {
                let res, data;
                if (!id) {
                    if (!password) {
                        showBanner(errorDiv, 'Password is required for new users.');
                        btn.disabled = false;
                        btn.innerHTML = BTN_SAVE_HTML;
                        return;
                    }
                    res = await fetch('http://localhost:8080/api/users/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(`http://localhost:8080/api/users/update/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                data = await res.json();
                if (res.ok) {
                    closeModal();
                    showToast('success', data.message || 'Operation successful.');
                    loadUsers();
                } else {
                    showBanner(errorDiv, data.message || 'Operation failed.');
                }
            } catch(err) {
                showBanner(errorDiv, 'Cannot connect to server.');
            }
            btn.disabled = false;
            btn.innerHTML = BTN_SAVE_HTML;
        });

        function openDeleteModal(id) {
            pendingDeleteId = id;
            document.getElementById('delete-overlay').classList.remove('hidden');
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById('delete-overlay').classList.add('hidden');
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async function() {
            if (!pendingDeleteId) return;
            this.disabled = true;
            this.innerHTML = '<span class="btn-spinner"></span> Deleting…';
            try {
                const res = await fetch(`http://localhost:8080/api/users/delete/${pendingDeleteId}`, { method: 'DELETE' });
                const data = await res.json();
                closeDeleteModal();
                if (res.ok) {
                    showToast('success', data.message || 'User deleted.');
                    loadUsers();
                } else {
                    showToast('error', data.message || 'Delete failed.');
                }
            } catch(err) {
                showToast('error', 'Cannot connect to server.');
                closeDeleteModal();
            }
            this.disabled = false;
            this.innerHTML = `${TRASH_ICON} Delete`;
        });

        function escHtml(str) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str || ''));
            return d.innerHTML;
        }
    </script>
</body>
</html>
